[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "formosync"
version = "0.1.0"
description = "Taiwan Mandarin and schema-grounded tool-use research tooling"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "ShuChenAI contributors"}]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
gpu = ["torch==2.7.1", "transformers==5.21.0", "peft==0.21.2", "bitsandbytes==0.50.2", "safetensors>=0.5", "huggingface-hub>=0.30"]

[project.scripts]
formosync-chat = "formosync.chat:main"
formosync-benchmark = "formosync.benchmark:main"

[tool.setuptools.packages.find]
include = ["formosync*"]

[tool.setuptools.package-data]
"formosync.scoring" = ["answer-schema.json"]
